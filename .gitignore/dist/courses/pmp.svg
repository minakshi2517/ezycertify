<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pmpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#0074e4" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#pmpGrad)" rx="16" />
  <circle cx="500" cy="80" r="180" fill="rgba(255,255,255,0.05)" />
  <circle cx="100" cy="300" r="120" fill="rgba(229,26,36,0.15)" />

  <!-- Badge Seal -->
  <rect x="50" y="50" width="140" height="36" rx="18" fill="#e51a24" />
  <text x="120" y="73" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1">PMI APPROVED</text>

  <!-- Title -->
  <text x="50" y="145" font-family="'Outfit', sans-serif" font-weight="900" font-size="38" fill="#ffffff">PMP® Certification</text>
  <text x="50" y="185" font-family="'Poppins', sans-serif" font-weight="600" font-size="20" fill="#93c5fd">Project Management Professional</text>

  <!-- Features Pills -->
  <rect x="50" y="230" width="160" height="40" rx="8" fill="rgba(255,255,255,0.12)" />
  <text x="130" y="255" font-family="'Poppins', sans-serif" font-weight="600" font-size="15" fill="#ffffff" text-anchor="middle">35 Contact Hours</text>

  <rect x="225" y="230" width="160" height="40" rx="8" fill="rgba(255,255,255,0.12)" />
  <text x="305" y="255" font-family="'Poppins', sans-serif" font-weight="600" font-size="15" fill="#ffffff" text-anchor="middle">2500+ Practice Qs</text>

  <rect x="400" y="230" width="150" height="40" rx="8" fill="rgba(255,255,255,0.12)" />
  <text x="475" y="255" font-family="'Poppins', sans-serif" font-weight="600" font-size="15" fill="#ffffff" text-anchor="middle">3 ECO Domains</text>
</svg>
