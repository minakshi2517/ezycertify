<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="100%" height="100%">
  <defs>
    <style>
      .navy-text { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 800; font-size: 32px; fill: #0f2b5c; }
      .blue-text { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 800; font-size: 32px; fill: #0074e4; }
      .tagline-text { font-family: 'Poppins', -apple-system, sans-serif; font-weight: 700; font-size: 8.5px; fill: #0f2b5c; letter-spacing: 2.2px; }
    </style>
  </defs>

  <!-- Logo Mark Group -->
  <g transform="translate(6, 4)">
    <!-- Shield / Badge Base -->
    <path d="M28 4 L48 12 V28 C48 40 28 50 28 50 C28 50 8 40 8 28 V12 Z" fill="#0f2b5c" />
    <!-- Inner Accent -->
    <path d="M28 9 L43 15 V27 C43 36 28 44 28 44 C28 44 13 36 13 27 V15 Z" fill="#0074e4" opacity="0.9" />
    <!-- Red Checkmark -->
    <path d="M20 26 L26 32 L37 19" stroke="#e51a24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Graduation Cap Top Accent -->
    <polygon points="28,2 10,11 28,18 46,11" fill="#e51a24" />
  </g>

  <!-- Brand Typography -->
  <text x="64" y="38" className="brand-title">
    <tspan fill="#0f2b5c" font-family="'Outfit', sans-serif" font-weight="800" font-size="31">Ezy</tspan>
    <tspan fill="#0074e4" font-family="'Outfit', sans-serif" font-weight="800" font-size="31">certify</tspan>
  </text>

  <!-- Red Accent Dot on 'i' -->
  <circle cx="209" cy="18" r="3.2" fill="#e51a24" />

  <!-- Tagline -->
  <text x="65" y="54" class="tagline-text">MAKING CERTIFICATION EASY</text>
</svg>
